  from {

    opacity: 1;
    transform: none;
  }
}
@keyframes sbPop {
  from {
    opacity: 0;
    transform: scale(.9);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

  from {
    opacity: 0;
    transform: translateY(-16px);
  }
  70% {
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

  0%,100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-6px);
  }
  75% {
    transform: translateX(6px);
  }
}
.sb-in {
  animation: sbIn .3s ease-out both;
}
.sb-pop {
  animation: sbPop .35s cubic-bezier(.2,.9,.3,1.3) both;
}
.sb-rise {
  animation: sbRise .6s ease-out both;
  transform-box: fill-box;
}
.sb-lift {
  transition: transform .2s;
}
.sb-lift:hover {
  transform: translateY(-4px) rotate(-.6deg);
}
.shake {
  animation: shake .3s ease-in-out 2;

exports.PUZZLES = [{ "id": "M1P1", "lesson": 1, "standard": "S4", "type": "match", "title": "What Is Everything Made Of?", "difficulty": "normal", "unlocks_card": "democritus", "instructions": "Drag each word onto its meaning. On a tablet or phone, tap a word and then tap its meaning.", "content": { "items": [{ "id": "mat", "label": "Matter" }, { "id": "atm", "label": "Atom" }, { "id": "elm", "label": "Element" }, { "id": "ptb", "label": "Periodic table" }, { "id": "sym", "label": "Chemical symbol" }], "targets": [{ "id": "a3", "label": "Anything that has mass and takes up space." }, { "id": "a5", "label": "A tiny particle that all matter is made of." }, { "id": "a1", "label": "A substance made of only one type of atom." }, { "id": "a4", "label": "A chart that lists all the elements — about 118 of them." }, { "id": "a2", "label": "One or two letters that stand for an element, like O or Na." }] }, "solution": { "pairs": { "mat": "a3", "atm": "a5", "elm": "a1", "ptb": "a4", "sym": "a2" } }, "hints": ["Matter is everything around you — even air.", "An element has just one TYPE of atom, but it can have billions of atoms."], "explanation": "All matter is made of atoms. An element contains only one type of atom, and about 118 different elements are listed in the periodic table. Each element has a chemical symbol of one or two letters, for example C for carbon and Na for sodium.", "topic": "L1 · What is everything made of?", "sort_order": 1, "level_id": 1 }, { "id": "M1P2", "lesson": 1, "standard": "S4", "type": "match", "title": "Symbol Detective", "difficulty": "normal", "unlocks_card": "mendeleev", "instructions": "Match each chemical symbol to its element. Watch out — some symbols come from old Latin names!", "content": { "items": [{ "id": "s_h", "label": "H" }, { "id": "s_o", "label": "O" }, { "id": "s_c", "label": "C" }, { "id": "s_n", "label": "N" }, { "id": "s_na", "label": "Na" }, { "id": "s_fe", "label": "Fe" }, { "id": "s_au", "label": "Au" }, { "id": "s_k", "label": "K" }], "targets": [{ "id": "e7", "label": "Hydrogen" }, { "id": "e2", "label": "Oxygen" }, { "id": "e8", "label": "Carbon" }, { "id": "e4", "label": "Nitrogen" }, { "id": "e1", "label": "Sodium" }, { "id": "e6", "label": "Iron" }, { "id": "e3", "label": "Gold" }, { "id": "e5", "label": "Potassium" }] }, "solution": { "pairs": { "s_h": "e7", "s_o": "e2", "s_c": "e8", "s_n": "e4", "s_na": "e1", "s_fe": "e6", "s_au": "e3", "s_k": "e5" } }, "hints": ["Na comes from natrium and K from kalium.", "Fe comes from ferrum and Au from aurum (the Latin word for gold)."], "explanation": "H hydrogen, O oxygen, C carbon, N nitrogen. Some symbols come from Latin: Na from natrium (sodium), Fe from ferrum (iron), Au from aurum (gold) and K from kalium (potassium). A symbol always starts with a capital letter; a second letter is lower case.", "topic": "L1 · What is everything made of?", "sort_order": 2, "level_id": 1 }, { "id": "M1P3", "lesson": 2, "standard": "S1", "type": "jigsaw", "title": "Rebuild the Gold Foil Experiment", "difficulty": "normal", "instructions": "Rutherford's diagram is broken into 9 tiles. Tap one tile, then another, to swap them. Rebuild the diagram and press Check.", "content": { "art": "goldfoil", "grid": 3, "caption": "Alpha particles fired at a thin sheet of gold" }, "solution": { "order": ["0", "1", "2", "3", "4", "5", "6", "7", "8"] }, "hints": ["The source of alpha particles goes on the left; the gold foil is in the middle.", "The circular detector screen surrounds the foil."], "explanation": "In 1909, Geiger and Marsden fired positive alpha particles from a radioactive source at gold foil only a few hundred atoms thick. A detector screen all around the foil glowed with a tiny flash wherever an alpha particle hit it, so they could see where the particles went.", "topic": "L2 · Rutherford's model", "sort_order": 3, "level_id": 1 }, { "id": "M1P4", "lesson": 2, "standard": "S1", "type": "match", "title": "What the Evidence Showed", "difficulty": "hard", "instructions": "Each picture shows what happened to some alpha particles (the red dot is a nucleus). Match each observation to the conclusion it gave Rutherford.", "content": { "items": [{ "id": "o1", "label": "Most went straight through", "icon": "alpha-straight" }, { "id": "o2", "label": "A few were deflected at angles", "icon": "alpha-deflect" }, { "id": "o3", "label": "A very few bounced straight back", "icon": "alpha-back" }], "targets": [{ "id": "c2", "label": "The atom is mostly empty space." }, { "id": "c3", "label": "The centre of the atom has a positive charge that repels the positive alpha particles." }, { "id": "c1", "label": "The positive charge and most of the mass are packed into a tiny, dense nucleus." }] }, "solution": { "pairs": { "o1": "c2", "o2": "c3", "o3": "c1" } }, "hints": ["If nothing is in the way, a particle goes straight through.", "Only a direct hit on something very small and heavy can send a particle back."], "explanation": "Most alpha particles passed straight through, so atoms are mostly empty space. Some were deflected, because like charges repel: the centre must be positive. A very few bounced back, which needs a direct hit on something tiny, dense and positive — the nucleus.", "topic": "L2 · Rutherford's model", "sort_order": 4, "level_id": 1 }, { "id": "M1P5", "lesson": 2, "standard": "S1", "type": "select", "title": "Which Model Fits the Evidence?", "difficulty": "normal", "unlocks_card": "thomson", "instructions": "Tap the ONE model of the atom that explains all of the gold foil results, then press Check.", "content": { "multi": false, "options": [{ "id": "q4", "label": "Solid sphere (Dalton)", "visual": { "model": "solid" } }, { "id": "q2", "label": "Plum pudding (Thomson)", "visual": { "model": "pudding" } }, { "id": "q1", "label": "Nuclear model (Rutherford)", "visual": { "model": "nuclear" } }, { "id": "q3", "label": "Huge nucleus filling the atom", "visual": { "model": "bignucleus" } }] }, "solution": { "choices": ["q1"] }, "hints": ["The model must have lots of empty space.", "It must also have something small, dense and positive."], "explanation": "Only the nuclear model fits: a tiny, dense, positive nucleus with electrons around it and mostly empty space. In the plum pudding model the positive charge is spread out, so no particle should bounce back. The model changed because new evidence appeared — scientific models are always open to change.", "topic": "L2 · Rutherford's model", "sort_order": 5, "level_id": 1 }, { "id": "M1P6", "lesson": 2, "standard": "S1", "type": "order", "title": "How Our Model of the Atom Changed", "difficulty": "hard", "instructions": "Put these ideas in order, from the oldest at the top to the newest at the bottom.", "content": { "items": [{ "id": "t5", "label": "Democritus suggests everything is made of tiny uncuttable particles." }, { "id": "t2", "label": "Dalton describes atoms as tiny solid spheres." }, { "id": "t6", "label": "Thomson discovers the electron and proposes the plum pudding model." }, { "id": "t1", "label": "Rutherford's gold foil experiment reveals the nucleus." }, { "id": "t4", "label": "Bohr suggests electrons move in shells around the nucleus." }, { "id": "t3", "label": "Chadwick discovers the neutron." }], "top_label": "Oldest", "bottom_label": "Newest" }, "solution": { "order": ["t5", "t2", "t6", "t1", "t4", "t3"] }, "hints": ["The nucleus had to be found before scientists could arrange electrons around it.", "The neutron was the last of the three particles to be discovered."], "explanation": "About 400 BCE Democritus; 1803–1808 Dalton; 1897–1904 Thomson; 1909–1911 Rutherford; 1913 Bohr; 1932 Chadwick. Each new model was built on new evidence.", "topic": "L2 · Rutherford's model", "sort_order": 6, "level_id": 1 }, { "id": "M1P7", "lesson": 3, "standard": "S1", "type": "spot", "title": "Inside the Atom: Spot the Mistakes", "difficulty": "normal", "instructions": "Tap every statement that is WRONG, then press Check.", "content": { "statements": [{ "id": "p1", "text": "A proton has a relative charge of +1 and a neutron has a relative charge of 0." }, { "id": "p2", "text": "The number of neutrons decides which element an atom is." }, { "id": "p3", "text": "Electrostatic attraction between opposite charges holds electrons near the nucleus." }, { "id": "p4", "text": "Protons and electrons are both found inside the nucleus." }, { "id": "p5", "text": "A neutral atom has the same number of protons and electrons." }, { "id": "p6", "text": "An electron has a much smaller mass than a proton." }] }, "solution": { "choices": ["p2", "p4"] }, "hints": ["There are two mistakes.", "The atomic number (proton number) identifies an element."], "explanation": "Wrong: the proton number (atomic number), not the neutron number, identifies the element. Wrong: only protons and neutrons are in the nucleus — electrons are around it, held by electrostatic attraction to the positive nucleus. Relative charges: proton +1, neutron 0, electron −1; relative masses: proton 1, neutron 1, electron about 1/1836.", "topic": "L3 · Protons, neutrons and electrons", "sort_order": 7, "level_id": 1 }, { "id": "M1P8", "lesson": 3, "standard": "S1", "type": "model", "title": "Build a Sodium Atom", "difficulty": "hard", "instructions": "Use the + and − buttons to build a neutral sodium atom. Your model updates as you build.", "content": { "element": "Sodium", "symbol": "Na", "info": "Atomic number 11 · Mass number 23", "note": "Atomic number = number of protons. Mass number = protons + neutrons. Shell 1 holds up to 2 electrons, shell 2 up to 8, and the rest go in shell 3.", "fields": [{ "key": "protons", "label": "Protons", "max": 14 }, { "key": "neutrons", "label": "Neutrons", "max": 14 }, { "key": "shell1", "label": "Electrons in shell 1", "max": 4 }, { "key": "shell2", "label": "Electrons in shell 2", "max": 10 }, { "key": "shell3", "label": "Electrons in shell 3", "max": 6 }] }, "solution": { "values": { "protons": 11, "neutrons": 12, "shell1": 2, "shell2": 8, "shell3": 1 } }, "hints": ["Neutrons = mass number − atomic number = 23 − 11.", "A neutral atom has 11 electrons. Fill shell 1, then shell 2, then put the rest in shell 3."], "explanation": "Sodium has atomic number 11, so 11 protons. Mass number 23 − 11 = 12 neutrons. A neutral atom has 11 electrons arranged 2, 8, 1.", "topic": "L3 · Protons, neutrons and electrons", "sort_order": 8, "level_id": 1 }, { "id": "M2P1", "lesson": 4, "standard": "S4", "type": "logic", "title": "Element or Compound Molecule?", "difficulty": "normal", "instructions": "Look at each molecule model. Decide whether it is a molecule of an ELEMENT (one type of atom) or of a COMPOUND (two or more types of atom joined).", "content": { "row_label": "Molecule", "rows": [{ "id": "r1", "visual": { "molecule": "O2" } }, { "id": "r2", "visual": { "molecule": "H2O" } }, { "id": "r3", "visual": { "molecule": "N2" } }, { "id": "r4", "visual": { "molecule": "CO2" } }, { "id": "r5", "visual": { "molecule": "CH4" } }, { "id": "r6", "visual": { "molecule": "H2" } }], "options": [{ "id": "oe", "label": "Molecule of an element" }, { "id": "oc", "label": "Molecule of a compound" }], "key": "Red = oxygen · white = hydrogen · dark grey = carbon · blue = nitrogen" }, "solution": { "pairs": { "r1": "oe", "r2": "oc", "r3": "oe", "r4": "oc", "r5": "oc", "r6": "oe" } }, "hints": ["Count how many COLOURS of atom are in the molecule.", "O₂, N₂ and H₂ are diatomic elements: two of the same atom joined."], "explanation": "O₂, N₂ and H₂ are molecules of elements — each has two atoms of the same type (diatomic). H₂O, CO₂ and CH₄ are molecules of compounds because they contain more than one type of atom chemically joined.", "topic": "L4 · From atoms to molecules", "sort_order": 1, "level_id": 2 }, { "id": "M2P2", "lesson": 4, "standard": "S1", "type": "missing", "title": "Reading Chemical Formulas", "difficulty": "normal", "instructions": "A small number after a symbol (a subscript) tells you how many of that atom there are. Type the number for each blank.", "content": { "input": "number", "intro": "Example: in NH₃ there is 1 nitrogen atom and 3 hydrogen atoms. No number means 1.", "sentences": [{ "before": "In H₂O, there are", "after": "hydrogen atoms." }, { "before": "One molecule of CO₂ contains", "after": "atoms in total." }, { "before": "In CH₄ (methane), there are", "after": "hydrogen atoms." }, { "before": "In C₆H₁₂O₆ (glucose), there are", "after": "carbon atoms." }, { "before": "One molecule of C₆H₁₂O₆ contains", "after": "atoms in total." }] }, "solution": { "blanks": [["2"], ["3"], ["4"], ["6"], ["24"]] }, "hints": ["CO₂ = 1 carbon + 2 oxygen.", "For glucose, add 6 + 12 + 6."], "explanation": "H₂O: 2 hydrogen and 1 oxygen. CO₂: 1 carbon + 2 oxygen = 3 atoms. CH₄: 4 hydrogen. C₆H₁₂O₆: 6 carbon, 12 hydrogen and 6 oxygen = 24 atoms. A chemical formula shows the type and number of atoms in one molecule.", "topic": "L4 · From atoms to molecules", "sort_order": 2, "level_id": 2 }, { "id": "M2P3", "lesson": 5, "standard": "S1", "type": "molecule", "title": "Molecule Builder", "difficulty": "hard", "instructions": "Build one molecule of each substance by adding atoms. Switch between ball-and-stick and space-filling models to compare them.", "content": { "elements": ["H", "C", "O"], "max": 6, "targets": [{ "name": "Water" }, { "name": "Carbon dioxide" }, { "name": "Methane" }] }, "solution": { "values": { "0_H": 2, "0_C": 0, "0_O": 1, "1_H": 0, "1_C": 1, "1_O": 2, "2_H": 4, "2_C": 1, "2_O": 0 } }, "hints": ["Water is H₂O and carbon dioxide is CO₂.", "Methane is CH₄ — one carbon in the middle."], "explanation": "Water H₂O: 2 hydrogen + 1 oxygen. Carbon dioxide CO₂: 1 carbon + 2 oxygen. Methane CH₄: 1 carbon + 4 hydrogen. Ball-and-stick models show which atoms are joined; space-filling models show the overall shape better. Neither shows that real atoms have no colour.", "topic": "L5 · Modelling molecules", "sort_order": 3, "level_id": 2 }, { "id": "M2P4", "lesson": 5, "standard": "S4", "type": "select", "title": "Every Model Has Limits", "difficulty": "normal", "instructions": "Tap every statement that is TRUE about molecule models. There is more than one.", "content": { "multi": true, "options": [{ "id": "m1", "label": "Ball-and-stick models clearly show which atoms are joined to which." }, { "id": "m2", "label": "Real atoms have colours, just like the balls in a model." }, { "id": "m3", "label": "Space-filling models show the shape of a molecule more realistically." }, { "id": "m4", "label": "The bonds between atoms are real sticks." }, { "id": "m5", "label": "Every model has limitations, so scientists use different models for different jobs." }, { "id": "m6", "label": "Models are usually much bigger than the real molecule." }] }, "solution": { "choices": ["m1", "m3", "m5", "m6"] }, "hints": ["Colours in models are chosen by people to tell elements apart.", "There are four true statements."], "explanation": "True: ball-and-stick models show connections; space-filling models show shape; all models have limitations; models are millions of times bigger than real molecules. False: atoms have no colour, and bonds are forces of attraction, not sticks.", "topic": "L5 · Modelling molecules", "sort_order": 4, "level_id": 2 }, { "id": "M2P5", "lesson": 5, "standard": "S1", "type": "order", "title": "Small to Giant", "difficulty": "normal", "unlocks_card": "franklin", "instructions": "Arrange these molecules from the fewest atoms (top) to the most atoms (bottom).", "content": { "items": [{ "id": "z3", "label": "Oxygen, O₂" }, { "id": "z6", "label": "Water, H₂O" }, { "id": "z1", "label": "Methane, CH₄" }, { "id": "z5", "label": "Glucose, C₆H₁₂O₆" }, { "id": "z2", "label": "A protein molecule" }, { "id": "z4", "label": "The DNA molecule in one human chromosome" }], "top_label": "Fewest atoms", "bottom_label": "Most atoms" }, "solution": { "order": ["z3", "z6", "z1", "z5", "z2", "z4"] }, "hints": ["Count the atoms in each formula first.", "Proteins have thousands of atoms; DNA in a chromosome has billions."], "explanation": "O₂ has 2 atoms, H₂O 3, CH₄ 5, glucose 24. Proteins are macromolecules with thousands of atoms, and the DNA molecule in a single human chromosome contains billions of atoms. Rosalind Franklin's X-ray images helped reveal the shape of DNA.", "topic": "L5 · Modelling molecules", "sort_order": 5, "level_id": 2 }, { "id": "M2P6", "lesson": 6, "standard": "S1", "type": "logic", "title": "Discrete Molecules or Giant Lattice?", "difficulty": "normal", "instructions": "Each box shows a close-up of a substance. Decide whether it is made of separate (discrete) molecules or an extended structure that repeats in every direction.", "content": { "row_label": "Substance", "rows": [{ "id": "d1", "label": "Sodium chloride (salt)", "visual": { "particles": { "kind": "lattice", "pattern": "nacl" } } }, { "id": "d2", "label": "Water", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "H2O", "n": 6 }] } } }, { "id": "d3", "label": "Diamond", "visual": { "particles": { "kind": "lattice", "pattern": "diamond" } } }, { "id": "d4", "label": "Carbon dioxide gas", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "CO2", "n": 4 }] } } }, { "id": "d5", "label": "Copper metal", "visual": { "particles": { "kind": "lattice", "pattern": "metal" } } }], "options": [{ "id": "xm", "label": "Discrete molecules" }, { "id": "xl", "label": "Extended structure (lattice)" }] }, "solution": { "pairs": { "d1": "xl", "d2": "xm", "d3": "xl", "d4": "xm", "d5": "xl" } }, "hints": ["Look for separate groups of atoms with space between them.", "A lattice is a repeating pattern with no fixed size."], "explanation": "Water and carbon dioxide are made of separate molecules with a fixed number of atoms. Sodium chloride, diamond and copper are extended structures: a pattern of particles repeating in every direction, with no fixed size.", "topic": "L6 · Extended structures", "sort_order": 6, "level_id": 2 }, { "id": "M2P7", "lesson": 6, "standard": "S4", "type": "missing", "title": "Formulas of Giant Structures", "difficulty": "hard", "instructions": "For extended structures, the formula shows a RATIO. Type the missing number or word.", "content": { "sentences": [{ "before": "In sodium chloride, NaCl, for every 1 sodium there is", "after": "chlorine." }, { "before": "In magnesium chloride, MgCl₂, for every 1 magnesium there are", "after": "chlorines." }, { "before": "Silicon dioxide (sand) is SiO₂. For every 1 silicon there are", "after": "oxygens." }, { "before": "For an extended structure, the formula shows a", "after": "of atoms, not the exact number in the sample." }] }, "solution": { "blanks": [["1", "one"], ["2", "two"], ["2", "two"], ["ratio"]] }, "hints": ["The subscript after Cl in MgCl₂ is 2.", "The last answer is a five-letter word."], "explanation": "NaCl has a 1 : 1 ratio, MgCl₂ a 1 : 2 ratio and SiO₂ a 1 : 2 ratio. A grain of salt contains trillions of particles, so the formula of an extended structure tells you the ratio, not the total count. For a discrete molecule like H₂O, the formula gives the exact number of atoms.", "topic": "L6 · Extended structures", "sort_order": 7, "level_id": 2 }, { "id": "M3P1", "lesson": 7, "standard": "S2", "type": "logic", "title": "Particle Diagram Sort", "difficulty": "normal", "instructions": "Each box is a particle diagram of a substance. Decide whether it shows a pure element, a pure compound, or a mixture.", "content": { "row_label": "Box", "rows": [{ "id": "b1", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "He", "n": 7 }] } } }, { "id": "b2", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "H2O", "n": 6 }] } } }, { "id": "b3", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "O2", "n": 3 }, { "m": "N2", "n": 3 }] } } }, { "id": "b4", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "O2", "n": 6 }] } } }, { "id": "b5", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "H2O", "n": 3 }, { "m": "CO2", "n": 3 }] } } }, { "id": "b6", "visual": { "particles": { "kind": "molecules", "items": [{ "m": "He", "n": 4 }, { "m": "H2O", "n": 3 }] } } }], "options": [{ "id": "pe", "label": "Pure element" }, { "id": "pc", "label": "Pure compound" }, { "id": "mx", "label": "Mixture" }], "key": "Pink = helium · red = oxygen · white = hydrogen · dark grey = carbon · blue = nitrogen" }, "solution": { "pairs": { "b1": "pe", "b2": "pc", "b3": "mx", "b4": "pe", "b5": "mx", "b6": "mx" } }, "hints": ["A pure substance contains only ONE type of particle.", "If you can see two different kinds of particle, it is a mixture."], "explanation": "Box 1 (helium atoms) and Box 4 (O₂ molecules) are pure elements. Box 2 (only H₂O) is a pure compound. Boxes 3, 5 and 6 contain two kinds of particles that are not chemically joined, so they are mixtures.", "topic": "L7 · Pure or mixed?", "sort_order": 1, "level_id": 3 }, { "id": "M3P2", "lesson": 7, "standard": "S4", "type": "select", "title": "Pure… or Just Called Pure?", "difficulty": "normal", "instructions": "In everyday language “pure” means “nothing added”. In science it means only ONE substance. Tap every item that is a pure substance in the SCIENTIFIC sense.", "content": { "multi": true, "options": [{ "id": "u1", "label": "Distilled water" }, { "id": "u2", "label": "“100% pure” orange juice" }, { "id": "u3", "label": "Sea water" }, { "id": "u4", "label": "Oxygen gas from a cylinder (only O₂)" }, { "id": "u5", "label": "Air" }, { "id": "u6", "label": "Copper wire (only copper atoms)" }, { "id": "u7", "label": "Milk" }, { "id": "u8", "label": "Table sugar crystals (sucrose)" }] }, "solution": { "choices": ["u1", "u4", "u6", "u8"] }, "hints": ["Orange juice contains water, sugars, acids and more.", "Air contains nitrogen, oxygen, argon and carbon dioxide."], "explanation": "Pure substances: distilled water, oxygen gas, copper and sucrose — each contains one type of particle. Orange juice, sea water, air and milk are mixtures, even when a label calls them “pure”.", "topic": "L7 · Pure or mixed?", "sort_order": 2, "level_id": 3 }, { "id": "M3P3", "lesson": 8, "standard": "S2", "type": "select", "title": "Read the Melting Graphs", "difficulty": "hard", "instructions": "Pure naphthalene melts at 80 °C. Three samples were heated and their temperature recorded. Tap the graph that shows the PURE sample.", "content": { "multi": false, "options": [{ "id": "g2", "label": "Sample A", "visual": { "curve": { "from": 72, "to": 79 } } }, { "id": "g1", "label": "Sample B", "visual": { "curve": { "from": 80, "to": 80 } } }, { "id": "g3", "label": "Sample C", "visual": { "curve": { "from": 66, "to": 76 } } }] }, "solution": { "choices": ["g1"] }, "hints": ["A pure substance melts at one sharp, fixed temperature.", "Look for a perfectly flat section of the line at 80 °C."], "explanation": "Sample B is pure: the temperature stays flat at exactly 80 °C while it melts. Samples A and C melt over a range of temperatures and below 80 °C — a sign of impurities. Impurities usually lower the melting point and make melting happen over a range.", "topic": "L8 · Measuring purity", "sort_order": 3, "level_id": 3 }, { "id": "M3P4", "lesson": 8, "standard": "S2", "type": "missing", "title": "Calculate the Purity", "difficulty": "hard", "instructions": "Use the formula to calculate each answer. Type numbers only.", "content": { "input": "number", "intro": "Percentage purity = (mass of the pure substance ÷ total mass of the sample) × 100", "sentences": [{ "before": "A 20 g sample of rock salt contains 18 g of sodium chloride. Its percentage purity is", "after": "%." }, { "before": "A 50 g sample of copper ore contains 5 g of copper. Its percentage purity is", "after": "%." }, { "before": "A 250 g bag of sugar is 96% pure. The mass of pure sugar in the bag is", "after": "g." }] }, "solution": { "blanks": [["90", "90.0"], ["10", "10.0"], ["240", "240.0"]] }, "hints": ["18 ÷ 20 = 0.9, then × 100.", "For the last one: 96 ÷ 100 × 250."], "explanation": "18 ÷ 20 × 100 = 90%. 5 ÷ 50 × 100 = 10%. 96% of 250 g = 0.96 × 250 = 240 g. Marie Curie processed tonnes of ore to obtain about a tenth of a gram of pure radium chloride!", "topic": "L8 · Measuring purity", "sort_order": 4, "level_id": 3 }, { "id": "M3P5", "lesson": 8, "standard": "S2", "type": "mystery", "title": "Identify the Mystery Liquid", "difficulty": "normal", "instructions": "Characteristic properties identify a substance. Read the clues, rule out suspects with ✕, then choose the mystery liquid.", "content": { "question": "Which clear liquid is in the flask?", "clues": ["It is a pure substance: it boils at one fixed temperature.", "Its density is less than the density of water.", "It boils at 78 °C."], "suspects": [{ "id": "l1", "name": "Water", "symbol": "H₂O", "facts": ["Boiling point 100 °C", "Density 1.00 g/cm³", "Pure substance"] }, { "id": "l2", "name": "Ethanol", "symbol": "C₂H₆O", "facts": ["Boiling point 78 °C", "Density 0.79 g/cm³", "Pure substance"] }, { "id": "l3", "name": "Propanone (acetone)", "symbol": "C₃H₆O", "facts": ["Boiling point 56 °C", "Density 0.78 g/cm³", "Pure substance"] }, { "id": "l4", "name": "Salt water", "symbol": "mix", "facts": ["Boils above 100 °C, over a range", "Density about 1.03 g/cm³", "Mixture"] }] }, "solution": { "choices": ["l2"] }, "hints": ["Clue 1 rules out the mixture.", "Two suspects are less dense than water — the boiling point decides."], "explanation": "Ethanol: a pure substance with a fixed boiling point of 78 °C and a density of 0.79 g/cm³. Salt water is a mixture, so it boils over a range. Water is denser, and propanone boils at 56 °C. Melting point, boiling point and density are characteristic properties.", "topic": "L8 · Measuring purity", "sort_order": 5, "level_id": 3 }, { "id": "M3P6", "lesson": 8, "standard": "S2", "type": "missing", "title": "The King's Golden Crown", "difficulty": "hard", "unlocks_card": "archimedes", "instructions": "Archimedes had to find out if the king's crown was pure gold. Use density = mass ÷ volume.", "content": { "intro": "The crown has a mass of 1000 g and a volume of 70 cm³. Pure gold has a density of 19.3 g/cm³.", "sentences": [{ "before": "The density of the crown is", "after": "g/cm³ (round to 1 decimal place)." }, { "before": "Is the crown pure gold? Type yes or no:", "after": "" }, { "before": "The crown probably contains a cheaper metal. In science, an unwanted substance mixed in is called an", "after": "." }] }, "solution": { "blanks": [["14.3", "14.29", "14.28", "14.2857"], ["no"], ["impurity", "impurities"]] }, "hints": ["1000 ÷ 70 = 14.28… which rounds to 14.3.", "Compare 14.3 with gold's 19.3 g/cm³."], "explanation": "Density = 1000 ÷ 70 ≈ 14.3 g/cm³. Pure gold is 19.3 g/cm³, so the crown is not pure gold — a less dense metal such as silver has probably been mixed in. That metal is an impurity, and it changes the characteristic property (density).", "topic": "L8 · Measuring purity", "sort_order": 6, "level_id": 3 }, { "id": "M3P7", "lesson": 8, "standard": "S2", "type": "spot", "title": "Impurity Inspector", "difficulty": "normal", "instructions": "Tap every statement that is WRONG, then press Check.", "content": { "statements": [{ "id": "i1", "text": "Impurities usually lower the melting point of a substance." }, { "id": "i2", "text": "A pure substance melts over a wide range of temperatures." }, { "id": "i3", "text": "Adding salt to water raises its boiling point." }, { "id": "i4", "text": "Density can help to identify a substance." }, { "id": "i5", "text": "If a food label says “pure”, it is always a pure substance in science." }, { "id": "i6", "text": "Purity can be written as a percentage." }] }, "solution": { "choices": ["i2", "i5"] }, "hints": ["There are two mistakes.", "Think back to the melting graphs and to “100% pure” orange juice."], "explanation": "Wrong: a pure substance melts at a sharp, fixed temperature, not over a range. Wrong: “pure” on a label usually means nothing was added — the product can still be a mixture. The other statements are correct.", "topic": "L8 · Measuring purity", "sort_order": 7, "level_id": 3 }, { "id": "M4P1", "lesson": 9, "standard": "S4", "type": "logic", "title": "Physical or Chemical Change?", "difficulty": "normal", "instructions": "Decide whether each change is PHYSICAL (no new substance) or CHEMICAL (a new substance forms).", "content": { "row_label": "Change", "rows": [{ "id": "c1", "visual": { "text": "Ice melting into water", "emoji": "🧊" } }, { "id": "c2", "visual": { "text": "Wood burning in a campfire", "emoji": "🔥" } }, { "id": "c3", "visual": { "text": "Sugar dissolving in tea", "emoji": "🍵" } }, { "id": "c4", "visual": { "text": "An iron nail rusting", "emoji": "🔩" } }, { "id": "c5", "visual": { "text": "Baking a cake", "emoji": "🎂" } }, { "id": "c6", "visual": { "text": "Crushing a drinks can", "emoji": "🥫" } }, { "id": "c7", "visual": { "text": "Frying an egg", "emoji": "🍳" } }], "options": [{ "id": "ph", "label": "Physical change" }, { "id": "ch", "label": "Chemical change" }] }, "solution": { "pairs": { "c1": "ph", "c2": "ch", "c3": "ph", "c4": "ch", "c5": "ch", "c6": "ph", "c7": "ch" } }, "hints": ["Ask: is there a new substance at the end?", "Changes of state, dissolving and changes of shape are physical."], "explanation": "Physical changes (melting, dissolving, crushing) make no new substance and are often easy to reverse. Chemical changes (burning, rusting, baking, cooking an egg) form new substances because the atoms are rearranged.", "topic": "L9 · Chemical reactions", "sort_order": 1, "level_id": 4 }, { "id": "M4P2", "lesson": 9, "standard": "S3", "type": "missing", "title": "Atoms Rearranged", "difficulty": "hard", "instructions": "Look at the particle diagram of hydrogen reacting with oxygen. Count the atoms and fill in each blank.", "content": { "input": "text", "visual": { "reaction": { "left": [{ "m": "H2", "n": 2 }, { "m": "O2", "n": 1 }], "right": [{ "m": "H2O", "n": 2 }] } }, "intro": "2H₂ + O₂ → 2H₂O", "sentences": [{ "before": "Hydrogen atoms before the reaction:", "after": "" }, { "before": "Hydrogen atoms after the reaction:", "after": "" }, { "before": "Oxygen atoms after the reaction:", "after": "" }, { "before": "The substances at the start of a reaction are called", "after": "." }, { "before": "The new substances made are called", "after": "." }, { "before": "In a reaction, atoms are not created or destroyed — they are", "after": "." }] }, "solution": { "blanks": [["4", "four"], ["4", "four"], ["2", "two"], ["reactants", "reactant"], ["products", "product"], ["rearranged", "rearrange", "rearranging"]] }, "hints": ["Each H₂ molecule has 2 hydrogen atoms, and there are 2 of them.", "Reactants → products. The atoms swap partners."], "explanation": "There are 4 hydrogen atoms and 2 oxygen atoms before and after the reaction. The reactants (hydrogen and oxygen) become the product (water) because the atoms are rearranged into new molecules. Lavoisier showed this is why total mass stays the same.", "topic": "L9 · Chemical reactions", "sort_order": 2, "level_id": 4 }, { "id": "M4P3", "lesson": 10, "standard": "S3", "type": "select", "title": "Spot the Evidence", "difficulty": "normal", "unlocks_card": "priestley", "instructions": "Tap every observation that is evidence that a CHEMICAL REACTION may have happened. Careful — some are physical changes!", "content": { "multi": true, "options": [{ "id": "v1", "label": "Bubbles of gas form when vinegar is added to baking soda" }, { "id": "v2", "label": "A cloudy solid (precipitate) appears when two clear solutions are mixed" }, { "id": "v3", "label": "Water bubbles when it boils" }, { "id": "v4", "label": "The mixture gets hot without being heated" }, { "id": "v5", "label": "Salt disappears when stirred into water" }, { "id": "v6", "label": "A blue solution turns green when another solution is added" }, { "id": "v7", "label": "A new smell is produced" }, { "id": "v8", "label": "Ice melts in your hand" }] }, "solution": { "choices": ["v1", "v2", "v4", "v6", "v7"] }, "hints": ["Boiling water makes bubbles, but it is still water.", "Five observations are evidence of a reaction."], "explanation": "Signs of a reaction: gas produced, a precipitate, a temperature change, a colour change and a new smell. Boiling, dissolving and melting are physical changes — no new substance forms. These signs suggest a reaction; measuring changed properties confirms a new substance.", "topic": "L10 · Evidence of a reaction", "sort_order": 3, "level_id": 4 }, { "id": "M4P4", "lesson": 10, "standard": "S3", "type": "logic", "title": "Observation or Inference?", "difficulty": "normal", "instructions": "An OBSERVATION is what you see or measure. An INFERENCE is what you think it means. Sort each statement.", "content": { "row_label": "Statement", "rows": [{ "id": "n1", "visual": { "text": "The solution turned from clear to milky white.", "emoji": "📝" } }, { "id": "n2", "visual": { "text": "A new insoluble substance (a precipitate) formed.", "emoji": "📝" } }, { "id": "n3", "visual": { "text": "The temperature rose from 21 °C to 35 °C.", "emoji": "📝" } }, { "id": "n4", "visual": { "text": "The reaction released heat energy.", "emoji": "📝" } }, { "id": "n5", "visual": { "text": "Bubbles appeared on the surface of the metal.", "emoji": "📝" } }, { "id": "n6", "visual": { "text": "A gas was produced by a chemical reaction.", "emoji": "📝" } }], "options": [{ "id": "ob", "label": "Observation" }, { "id": "in", "label": "Inference" }] }, "solution": { "pairs": { "n1": "ob", "n2": "in", "n3": "ob", "n4": "in", "n5": "ob", "n6": "in" } }, "hints": ["Could you check it directly with your eyes or a measuring instrument?", "Inferences use words like “formed”, “released” or “produced by”."], "explanation": "Observations describe what was seen or measured: the colour change, the temperature readings and the bubbles. Inferences explain them: a precipitate formed, heat was released, a gas was produced. Good scientists keep the two separate.", "topic": "L10 · Evidence of a reaction", "sort_order": 4, "level_id": 4 }, { "id": "M4P5", "lesson": 11, "standard": "S3", "type": "logic", "title": "Before and After: Analyse the Data", "difficulty": "hard", "instructions": "A class recorded properties before and after four tests. Decide whether each test shows that a NEW SUBSTANCE formed.", "content": { "row_label": "Test", "rows": [{ "id": "k1", "visual": { "text": "Sugar stirred into water seems to disappear. After evaporating the water, the crystals left have the same melting point as the sugar at the start.", "emoji": "🧪" } }, { "id": "k2", "visual": { "text": "Green copper carbonate is heated. A black solid is left, and the gas given off turns limewater milky.", "emoji": "🔥" } }, { "id": "k3", "visual": { "text": "An iron nail is placed in blue copper sulfate solution. The blue colour fades and a reddish-brown coating forms on the nail.", "emoji": "🔩" } }, { "id": "k4", "visual": { "text": "Wax is warmed until it melts, then cooled. It turns solid again and melts at the same temperature as before.", "emoji": "🕯️" } }], "options": [{ "id": "yr", "label": "Reaction — a new substance formed" }, { "id": "nr", "label": "No reaction — same substance" }] }, "solution": { "pairs": { "k1": "nr", "k2": "yr", "k3": "yr", "k4": "nr" } }, "hints": ["If a characteristic property (like melting point) is unchanged, it is the same substance.", "Look for a new colour, a new solid or a new gas."], "explanation": "Tests 1 and 4 are physical changes: the characteristic property (melting point) is unchanged, so it is the same substance. Tests 2 and 3 are chemical reactions: new substances formed (black copper oxide and carbon dioxide gas; copper metal coating the nail).", "topic": "L11 · Investigation: did a reaction occur?", "sort_order": 5, "level_id": 4 }, { "id": "M4P6", "lesson": 11, "standard": "S3", "type": "logic", "title": "Build a CER Argument", "difficulty": "normal", "instructions": "Students tested whether vinegar reacts with baking soda. Sort each sentence of their conclusion into Claim, Evidence or Reasoning.", "content": { "row_label": "Sentence", "rows": [{ "id": "e1", "visual": { "text": "A chemical reaction happened when vinegar was added to baking soda.", "emoji": "📝" } }, { "id": "e2", "visual": { "text": "Bubbles formed, and the temperature dropped from 22 °C to 16 °C.", "emoji": "📝" } }, { "id": "e3", "visual": { "text": "The mass of the open beaker decreased by 2 g.", "emoji": "📝" } }, { "id": "e4", "visual": { "text": "A gas and a temperature change are signs that new substances formed, so the atoms must have been rearranged.", "emoji": "📝" } }, { "id": "e5", "visual": { "text": "The mass dropped because a new substance — a gas — escaped from the open beaker.", "emoji": "📝" } }], "options": [{ "id": "cl", "label": "Claim" }, { "id": "ev", "label": "Evidence" }, { "id": "re", "label": "Reasoning" }] }, "solution": { "pairs": { "e1": "cl", "e2": "ev", "e3": "ev", "e4": "re", "e5": "re" } }, "hints": ["The claim answers the question in one sentence.", "Evidence is data; reasoning uses science to explain why the evidence supports the claim."], "explanation": "Claim: the answer to the question (a reaction happened). Evidence: the measured data (bubbles, temperature drop, mass decrease). Reasoning: the science that links them (gas and temperature change mean new substances; mass dropped because gas escaped). This is how to write the conclusion for your Criterion C report.", "topic": "L11 · Investigation: did a reaction occur?", "sort_order": 6, "level_id": 4 }, { "id": "M4P7", "lesson": 11, "standard": "S3", "type": "order", "title": "Plan the Investigation", "difficulty": "hard", "instructions": "Put the steps of the investigation “Did a reaction occur?” in the best order, from first (top) to last (bottom).", "content": { "items": [{ "id": "w4", "label": "Write a research question." }, { "id": "w1", "label": "Write a hypothesis that you can test." }, { "id": "w6", "label": "Identify the independent, dependent and control variables." }, { "id": "w2", "label": "Measure and record properties BEFORE mixing (mass, temperature, colour)." }, { "id": "w7", "label": "Mix the substances and record observations and measurements AFTER." }, { "id": "w3", "label": "Repeat the test to check the results are reliable." }, { "id": "w5", "label": "Analyse the data and write a claim–evidence–reasoning conclusion." }], "top_label": "First", "bottom_label": "Last" }, "solution": { "order": ["w4", "w1", "w6", "w2", "w7", "w3", "w5"] }, "hints": ["You need a question before you can predict an answer.", "You need all your data — including repeats — before you write the conclusion."], "explanation": "Question → hypothesis → variables → measure before → mix and measure after → repeat for reliability → analyse and write a CER conclusion. Planning (Criterion B) comes before processing and evaluating the data (Criterion C).", "topic": "L11 · Investigation: did a reaction occur?", "sort_order": 7, "level_id": 4 }];
